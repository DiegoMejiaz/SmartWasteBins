# Endurecimiento de Apache para Smart Waste Bin
ServerTokens Prod
ServerSignature Off

# Archivos internos que nunca deben descargarse
<FilesMatch "\.(sql|md|py|ya?ml|sh|ini|log|pem|drawio)$">
    Require all denied
</FilesMatch>
<FilesMatch "^(conexion_bd|db|logica_puntos|ui_web)\.php$">
    # Solo se incluyen desde otras páginas; no se ejecutan directamente
    Require all denied
</FilesMatch>
<DirectoryMatch "/(\.git|herramientas|diagramas)">
    Require all denied
</DirectoryMatch>
<Directory /var/www/html>
    Options -Indexes
</Directory>

# Cabeceras de seguridad básicas
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set X-Frame-Options "SAMEORIGIN"
