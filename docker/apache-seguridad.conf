# Endurecimiento de Apache para Smart Waste Bin
ServerTokens Prod
ServerSignature Off

# Archivos internos que nunca deben descargarse
<FilesMatch "\.(sql|md|py|ya?ml|sh|ini|log|pem|drawio)$">
    Require all denied
</FilesMatch>
# Carpetas internas: código que solo se incluye desde otras páginas, base de datos, documentación y scripts
<DirectoryMatch "^/var/www/html/(\.git|includes|vistas|database|docs|herramientas|docker)(/|$)">
    Require all denied
</DirectoryMatch>
<Directory /var/www/html>
    Options -Indexes
</Directory>

# Cabeceras de seguridad básicas
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set X-Frame-Options "SAMEORIGIN"
