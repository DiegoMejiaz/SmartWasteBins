<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
    <title>Smart Waste Bin</title>
    <link rel="stylesheet" href="assets/css/eco_widgets.css">
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
    <main class="acceso">
        <div class="acceso-marca">
            <span class="circulo grande"><svg class="icono"><use href="assets/img/iconos.svg#eco"></use></svg></span>
            <h1>Smart Waste Bin</h1>
            <p>Recicla, suma eco-puntos y cuida tu ciudad.</p>
        </div>

        <div class="tarjeta">
            <h2 style="font-size:1.375rem">Bienvenido</h2>
            <p class="texto-sec" style="margin:6px 0 0">Tu aliado inteligente para un futuro más limpio y sostenible en Cartagena.</p>
            <div class="botones">
                <a href="paginas/login.html" class="boton bloque">Iniciar sesión</a>
                <a href="paginas/insertar_usuario.html" class="boton contorno bloque">Crear cuenta</a>
            </div>
        </div>

        <div class="acciones" style="width:100%;max-width:440px;margin-top:20px;grid-template-columns:1fr">
            <button class="accion" type="button" onclick="window.abrirEcoModal('ecoModalTestimonios')">
                <span class="circulo"><svg class="icono"><use href="assets/img/iconos.svg#star"></use></svg></span>
                <span class="accion-cuerpo"><span class="accion-titulo">Testimonios</span><br><span class="accion-sub">Lo que dice la comunidad</span></span>
                <svg class="icono"><use href="assets/img/iconos.svg#chevron"></use></svg>
            </button>
            <button class="accion" type="button" onclick="window.abrirModalQR('Ciudadano UNICOLOMBO', '001')">
                <span class="circulo secundario"><svg class="icono"><use href="assets/img/iconos.svg#qr"></use></svg></span>
                <span class="accion-cuerpo"><span class="accion-titulo">Carné QR</span><br><span class="accion-sub">Identifícate en la estación</span></span>
                <svg class="icono"><use href="assets/img/iconos.svg#chevron"></use></svg>
            </button>
            <button class="accion" type="button" onclick="window.abrirEcoModal('ecoModalSoporte')">
                <span class="circulo"><svg class="icono"><use href="assets/img/iconos.svg#soporte"></use></svg></span>
                <span class="accion-cuerpo"><span class="accion-titulo">Soporte</span><br><span class="accion-sub">Mesa de ayuda</span></span>
                <svg class="icono"><use href="assets/img/iconos.svg#chevron"></use></svg>
            </button>
        </div>

        <div class="acceso-pie">&copy; 2026 Smart Waste Bin Project · UNICOLOMBO</div>
    </main>
    <script src="assets/js/eco_widgets.js"></script>
</body>
</html>
