<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Smart Waste Bin</title>
    <link rel="stylesheet" href="eco_widgets.css">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <main class="acceso">
        <div class="acceso-marca">
            <span class="circulo grande"><svg class="icono"><use href="iconos.svg#eco"></use></svg></span>
            <h1>Smart Waste Bin</h1>
            <p>Recicla, suma eco-puntos y cuida tu ciudad</p>
        </div>

        <div class="tarjeta">
            <a href="index.html" class="volver"><svg class="icono icono-sm"><use href="iconos.svg#back"></use></svg> Volver al inicio</a>
            <h2 style="font-size:1.375rem;margin:8px 0 20px">Iniciar sesión</h2>
            <form method="POST" action="login.php">
                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <div class="entrada">
                        <svg class="icono"><use href="iconos.svg#email"></use></svg>
                        <input type="email" name="correo" id="correo" placeholder="correo@ejemplo.com" autocomplete="email" required>
                    </div>
                </div>
                <div class="campo">
                    <label for="usuario">Nombre de usuario</label>
                    <div class="entrada">
                        <svg class="icono"><use href="iconos.svg#person"></use></svg>
                        <input type="text" name="usuario" id="usuario" placeholder="Tu usuario" autocomplete="username" required>
                    </div>
                </div>
                <button type="submit" class="boton bloque" style="margin-top:8px">Entrar</button>
            </form>
        </div>

        <p style="margin-top:20px" class="texto-sec">¿No tienes cuenta? <a href="insertar_usuario.html" style="font-weight:700;text-decoration:none">Crear cuenta</a></p>
        <div class="acceso-pie">Smart Waste Bin · Sistema de gestión de residuos</div>
    </main>
    <script src="eco_widgets.js"></script>
</body>
</html>
