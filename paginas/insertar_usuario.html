<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta · Smart Waste Bin</title>
    <link rel="stylesheet" href="../assets/css/eco_widgets.css">
    <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
    <main class="acceso" style="padding-top:32px">
        <div class="tarjeta">
            <a href="../index.html" class="volver"><svg class="icono icono-sm"><use href="../assets/img/iconos.svg#back"></use></svg> Volver al inicio</a>
            <h2 style="font-size:1.5rem;margin-top:8px">Crea tu cuenta</h2>
            <p class="texto-sec" style="margin:4px 0 20px">Empieza a acumular eco-puntos por cada kilo que recicles.</p>

            <form method="POST" action="../acciones/insertar_usuario.php">
                <div class="paso">Datos personales</div>
                <div class="campo">
                    <label for="id_usuario">Documento de identidad</label>
                    <div class="entrada">
                        <svg class="icono"><use href="../assets/img/iconos.svg#badge"></use></svg>
                        <input type="text" name="id_usuario" id="id_usuario" placeholder="Ej: 1234567890" inputmode="numeric" maxlength="10" pattern="[0-9]{1,10}" title="Solo números" required>
                    </div>
                </div>
                <div class="campo">
                    <label for="nombre_completo">Nombre completo</label>
                    <div class="entrada">
                        <svg class="icono"><use href="../assets/img/iconos.svg#person"></use></svg>
                        <input type="text" name="nombre_completo" id="nombre_completo" placeholder="Ej: Juan Pérez" autocomplete="name" maxlength="100" required>
                    </div>
                </div>
                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <div class="entrada">
                        <svg class="icono"><use href="../assets/img/iconos.svg#email"></use></svg>
                        <input type="email" name="correo" id="correo" placeholder="correo@ejemplo.com" autocomplete="email" required>
                    </div>
                </div>

                <div class="paso">Acceso</div>
                <div class="campo">
                    <label for="usuario">Alias (nombre de usuario)</label>
                    <div class="entrada">
                        <svg class="icono"><use href="../assets/img/iconos.svg#person"></use></svg>
                        <input type="text" name="usuario" id="usuario" placeholder="juanp123" autocomplete="username" autocapitalize="none" minlength="3" maxlength="30" pattern="(?=.*[A-Za-z_.])[A-Za-z0-9_.]{3,30}" title="Entre 3 y 30 caracteres: letras, números, punto o guion bajo (no solo números)" required>
                    </div>
                    <p class="ayuda">Podrás iniciar sesión con tu documento o con este alias.</p>
                </div>
                <div class="campo">
                    <label for="contrasena">Contraseña</label>
                    <div class="entrada">
                        <svg class="icono"><use href="../assets/img/iconos.svg#lock"></use></svg>
                        <input type="password" name="contrasena" id="contrasena" placeholder="Mínimo 6 caracteres" autocomplete="new-password" minlength="6" maxlength="72" required>
                        <button type="button" class="ver-clave" data-ver-clave aria-label="Mostrar contraseña">Ver</button>
                    </div>
                </div>
                <div class="campo">
                    <label for="confirmar">Confirmar contraseña</label>
                    <div class="entrada">
                        <svg class="icono"><use href="../assets/img/iconos.svg#lock"></use></svg>
                        <input type="password" name="confirmar" id="confirmar" placeholder="Repite la contraseña" autocomplete="new-password" data-confirma="contrasena" required>
                    </div>
                </div>
                <button type="submit" class="boton bloque" style="margin-top:8px">Crear cuenta</button>
            </form>
        </div>

        <p style="margin-top:20px" class="texto-sec">¿Ya tienes cuenta? <a href="../paginas/login.html" style="font-weight:700;text-decoration:none">Inicia sesión</a></p>
        <div class="acceso-pie">Smart Waste Bin · Sistema de gestión de residuos</div>
    </main>
    <script src="../assets/js/eco_widgets.js"></script>
</body>
</html>
